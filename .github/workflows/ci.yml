name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # permet de lancer la CI à la main depuis l'onglet Actions

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------
# CHOIX DES RUNNERS
# Par défaut, les jobs tournent sur les runners hébergés par GitHub.
# Pour utiliser tes runners auto-hébergés, crée ces variables dans
# Settings > Secrets and variables > Actions > onglet "Variables" :
#   RUNNER_LINUX   = ["self-hosted", "linux"]
#   RUNNER_WINDOWS = ["self-hosted", "windows"]
# Tous les runners qui portent ces labels se partagent les jobs.
# ---------------------------------------------------------------

jobs:
  # ---------------------------------------------------------------
  # C : compilation avec gcc et clang + analyse statique cppcheck
  # ---------------------------------------------------------------
  c:
    name: C (${{ matrix.compiler }})
    runs-on: ${{ vars.RUNNER_LINUX && fromJSON(vars.RUNNER_LINUX) || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v5

      - name: Installer les outils manquants
        run: |
          missing=""
          for tool in gcc clang make cmake cppcheck; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -z "$missing" ]; then
            echo "Tous les outils sont déjà installés."
            exit 0
          fi
          echo "Outils manquants :$missing"
          if command -v apt-get >/dev/null 2>&1; then
            SUDO=""
            [ "$(id -u)" -ne 0 ] && SUDO="sudo"
            $SUDO apt-get update
            $SUDO apt-get install -y build-essential clang cmake cppcheck
          else
            echo "::error::Installe à la main sur ce runner :$missing"
            exit 1
          fi

      - name: Compiler avec CMake
        if: hashFiles('**/CMakeLists.txt') != ''
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_FLAGS="-Wall -Wextra"
          cmake --build build --parallel

      - name: Compiler avec Make
        if: hashFiles('**/CMakeLists.txt') == '' && hashFiles('**/Makefile') != ''
        run: |
          MAKEFILE=$(find . -name Makefile -not -path './build/*' | head -n 1)
          make -C "$(dirname "$MAKEFILE")" CC="$CC"

      - name: Vérifier chaque fichier .c (aucun système de build trouvé)
        if: hashFiles('**/CMakeLists.txt') == '' && hashFiles('**/Makefile') == '' && hashFiles('**/*.c') != ''
        run: |
          INCLUDES=""
          for d in $(find . -type d -name include -not -path './.git/*'); do
            INCLUDES="$INCLUDES -I$d"
          done
          status=0
          while IFS= read -r -d '' f; do
            echo "::group::$f"
            $CC -std=c11 -Wall -Wextra -fsyntax-only -I"$(dirname "$f")" $INCLUDES "$f" || status=1
            echo "::endgroup::"
          done < <(find . -name '*.c' -not -path './.git/*' -print0)
          exit $status

      - name: Analyse statique (cppcheck)
        if: matrix.compiler == 'gcc' && hashFiles('**/*.c') != ''
        run: |
          cppcheck --enable=warning,performance,portability \
                   --error-exitcode=1 --inline-suppr --quiet \
                   -i build .

  # ---------------------------------------------------------------
  # Python : lint (ruff) + tests (pytest)
  # ---------------------------------------------------------------
  python:
    name: Python
    runs-on: ${{ vars.RUNNER_LINUX && fromJSON(vars.RUNNER_LINUX) || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        if: hashFiles('**/*.py') != ''
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        if: hashFiles('**/*.py') != ''
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint (ruff)
        if: hashFiles('**/*.py') != ''
        run: ruff check .

      - name: Tests (pytest)
        if: hashFiles('**/test_*.py', '**/*_test.py') != ''
        run: pytest -v

  # ---------------------------------------------------------------
  # PowerShell : analyse (PSScriptAnalyzer) + tests (Pester)
  # ---------------------------------------------------------------
  powershell:
    name: PowerShell
    runs-on: ${{ vars.RUNNER_WINDOWS && fromJSON(vars.RUNNER_WINDOWS) || 'windows-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Analyse des scripts (PSScriptAnalyzer)
        if: hashFiles('**/*.ps1', '**/*.psm1') != ''
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq 'Error') {
            Write-Error "PSScriptAnalyzer a trouvé des erreurs."
            exit 1
          }

      - name: Tests (Pester)
        if: hashFiles('**/*.Tests.ps1') != ''
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          Invoke-Pester -Path . -CI